<style>
:root{--navy:#022050;--cyan:#00d6d8;--yel:#ffd300;--bg:#f2fbfc;--ink:#0b1f3a;--mut:#4a5d78;--ok:#12805c;--okb:#e3f7ee;--bad:#b3261e;--badb:#fdeceb;--line:#cfe6ea}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:120px}
body{margin:0;font-family:Nunito,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;font-size:17px}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:50;border-bottom:4px solid var(--yel)}
.top{max-width:1100px;margin:auto;display:flex;align-items:center;gap:14px;padding:8px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff;flex:1;min-width:240px}
.brand img{height:52px;width:52px;border-radius:50%;object-fit:cover;background:#fff2}
.brand b{font-size:1.15rem;line-height:1.25}.brand b span{color:var(--cyan)}.brand small{display:block;color:var(--yel);font-weight:600;font-size:.8rem}
nav.main{display:flex;gap:8px}
nav.main a{color:#fff;text-decoration:none;font-weight:700;padding:8px 16px;border-radius:99px;border:2px solid var(--cyan);transition:.2s}
nav.main a:hover,nav.main a:focus-visible{background:var(--cyan);color:var(--navy);outline:none}
nav.main a.cur{background:var(--yel);border-color:var(--yel);color:var(--navy)}
.sub{background:#03307a;overflow-x:auto;white-space:nowrap}
.sub div{max-width:1100px;margin:auto;padding:4px 12px}
.sub a{color:#d8f7f8;text-decoration:none;font-weight:700;font-size:.9rem;padding:6px 12px;display:inline-block;border-radius:8px}
.sub a:hover{background:var(--cyan);color:var(--navy)}
main{max-width:1000px;margin:auto;padding:20px 16px 60px}
.hero{background:linear-gradient(135deg,var(--navy),#0a3a8c);color:#fff;border-radius:20px;padding:28px;border-left:10px solid var(--yel)}
.hero h1{margin:.2em 0;font-size:clamp(1.6rem,4vw,2.4rem);line-height:1.2}.hero p{margin:.4em 0;color:#dff}
.chip{display:inline-block;background:var(--cyan);color:var(--navy);font-weight:800;border-radius:99px;padding:2px 14px;font-size:.85rem}
section{margin-top:34px}
h2{font-size:1.6rem;color:var(--navy);border-bottom:4px solid var(--cyan);padding-bottom:6px;margin:0 0 14px}
h3{color:var(--navy);margin:22px 0 8px;font-size:1.2rem}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}
table{border-collapse:collapse;width:100%;background:#fff;margin:10px 0;font-size:.95rem}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--navy);color:#fff}
.wrap{overflow-x:auto}
.box{border-radius:12px;padding:12px 16px;margin:12px 0;border-left:6px solid}
.info{background:#e6f4ff;border-color:#2a7fd4}.warn{background:#fff6cc;border-color:var(--yel)}.star{background:#e4fbfb;border-color:var(--cyan)}
.fig{display:block;max-width:100%;height:auto;margin:10px auto}
figcaption{text-align:center;font-size:.88rem;color:var(--mut);font-style:italic}
figure{margin:12px 0;background:#fbfeff;border:1px dashed var(--line);border-radius:12px;padding:8px}
.formula{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.formula div{background:#fff;border:2px solid var(--cyan);border-radius:12px;padding:10px 14px}
.formula b{color:var(--navy)}
.ex h4{margin:0 0 6px;font-size:1.1rem;color:var(--navy)}
.lv{display:inline-block;font-size:.78rem;font-weight:800;padding:2px 10px;border-radius:99px;background:var(--yel);color:var(--navy);margin-right:6px}
.tabs{display:flex;gap:6px;margin:12px 0 0}
.tabs button{font:inherit;font-weight:800;border:2px solid var(--navy);background:#fff;color:var(--navy);padding:6px 14px;border-radius:10px 10px 0 0;cursor:pointer}
.tabs button.on{background:var(--navy);color:#fff}.tabs button[data-t=c].on{background:var(--yel);color:var(--navy);border-color:var(--yel)}
.p{border:2px solid var(--navy);border-radius:0 12px 12px 12px;padding:12px 16px;background:#fcffff}
.p.c{border-color:var(--yel);background:#fffbe0}
ol.steps{list-style:none;counter-reset:s;margin:0;padding:0}
ol.steps li{counter-increment:s;position:relative;padding:6px 0 10px 44px;border-left:3px solid var(--cyan);margin-left:14px}
ol.steps li::before{content:counter(s);position:absolute;left:-15px;top:6px;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;display:grid;place-items:center;font-size:.9rem}
.ans{background:var(--okb);border:2px solid var(--ok);border-radius:10px;padding:8px 12px;margin:8px 0 0;font-weight:700}
details.try{background:#eef1f5;border-radius:10px;padding:8px 14px;margin-top:10px}details.try summary{cursor:pointer;font-weight:800}
.opts{display:grid;gap:8px;margin:10px 0}
.opt{font:inherit;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;display:flex;gap:10px;align-items:center}
.opt:hover:not(:disabled){border-color:var(--cyan);background:#e9fdfd}
.opt:focus-visible,.tabs button:focus-visible,.btn:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.opt.right{background:var(--okb);border-color:var(--ok)}.opt.wrong{background:var(--badb);border-color:var(--bad)}
.opt:disabled{cursor:default}
.btn{font:inherit;font-weight:800;background:var(--cyan);color:var(--navy);border:0;border-radius:10px;padding:8px 18px;cursor:pointer}
.btn:hover{background:var(--yel)}
.fb{font-weight:800;margin:8px 0}.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
.bsrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}
.bsrow .opt{padding:6px 12px}
input.in{font:inherit;padding:8px 12px;border:2px solid var(--navy);border-radius:10px;width:180px}
.score{position:sticky;top:112px;z-index:5;background:var(--navy);color:#fff;border-radius:12px;padding:8px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.score b{color:var(--yel)}
footer{background:var(--navy);color:#cfeff0;text-align:center;padding:18px;border-top:4px solid var(--yel)}
@media(max-width:600px){body{font-size:16px}.score{top:150px}html{scroll-padding-top:170px}.brand b{font-size:1rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

<script>
const r=String.raw;
/* ===== GAMBAR (SVG buatan HTML) ===== */
const st='stroke="#022050" stroke-width="2" stroke-linejoin="round"',F1='#c9f7f8',F2='#8eeaec',F3='#eafdfd',WT='#6fc9ff';
const dsh='stroke="#022050" stroke-width="1.6" stroke-dasharray="5 4" fill="none"';
const P=(p,f)=>`<polygon points="${p}" fill="${f}" ${st}/>`;
const T=(x,y,s,a='middle')=>`<text x="${x}" y="${y}" font-size="13" font-weight="700" fill="#022050" text-anchor="${a}">${s}</text>`;
const D=(a,b,c,d)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" ${dsh}/>`;
const G=(x,y,s,k=1)=>`<g transform="translate(${x},${y}) scale(${k})">${s}</g>`;
const V=a=>`<svg class="fig" viewBox="0 0 ${a[0]} ${a[1]}" style="width:${Math.min(a[0],a[2]||a[0])}px" role="img">${a[3]||''}</svg>`;
const gl=(a,b,c,d)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="#022050" stroke-width="1" opacity=".45"/>`;
function box(w,h,d,la,lb,lc,g,wl,th){const dx=d*.7,dy=d*.45,x=40,y=14,fy=y+dy;let s='';
 s+=P(`${x},${fy} ${x+dx},${y} ${x+w+dx},${y} ${x+w},${fy}`,F3)+P(`${x},${fy} ${x+w},${fy} ${x+w},${fy+h} ${x},${fy+h}`,F1)+P(`${x+w},${fy} ${x+w+dx},${y} ${x+w+dx},${y+h} ${x+w},${fy+h}`,F2);
 if(wl){const wh=h*wl;s+=`<polygon points="${x},${fy+h-wh} ${x+w},${fy+h-wh} ${x+w},${fy+h} ${x},${fy+h}" fill="${WT}" opacity=".75"/><polygon points="${x+w},${fy+h-wh} ${x+w+dx},${y+h-wh} ${x+w+dx},${y+h} ${x+w},${fy+h}" fill="${WT}" opacity=".75"/>`+T(x+w/2,fy+h-wh/2+4,'air')}
 if(g){const[a,b,c]=g;for(let i=1;i<a;i++){s+=gl(x+i*w/a,fy,x+i*w/a,fy+h)+gl(x+i*w/a,fy,x+i*w/a+dx,y)}
  for(let j=1;j<c;j++){s+=gl(x,fy+j*h/c,x+w,fy+j*h/c)+gl(x+w,fy+j*h/c,x+w+dx,y+j*h/c)}
  for(let k=1;k<b;k++){s+=gl(x+dx*k/b,fy-dy*k/b,x+w+dx*k/b,fy-dy*k/b)+gl(x+w+dx*k/b,fy-dy*k/b,x+w+dx*k/b,fy-dy*k/b+h)}}
 let ex=0;if(th){const cx=x+w/2+dx/2,ay=y-th;s+=`<polygon points="${x},${fy} ${x+w},${fy} ${cx},${ay}" fill="${F1}" ${st}/><polygon points="${x+w},${fy} ${x+w+dx},${y} ${cx},${ay}" fill="${F2}" ${st}/><line x1="${x}" y1="${fy}" x2="${x+dx}" y2="${y}" ${dsh}/><line x1="${x+dx}" y1="${y}" x2="${cx}" y2="${ay}" ${dsh}/>`+D(cx,ay,cx,y+(fy-y)/2)+T(cx+6,ay+th/2+4,th.l||'t','start');ex=th}
 s+=T(x+w/2,fy+h+17,la)+T(x+w+dx/2+16,fy+h-dy/2+20,lb)+T(x-6,fy+h/2+4,lc,'end');
 return[x+w+dx+50,fy+h+30+ex,w+dx+90,th?G(0,th,s.replace(/<g/,'<g')):s]}
/* box dengan limas: th adalah objek angka */
function boxP(w,h,d,la,lb,lc,t,lt){const a=box(w,h,d,la,lb,lc);const dx=d*.7,dy=d*.45,x=40,y=14,fy=y+dy,cx=x+w/2+dx/2,ay=y-t;
 const ap=`<polygon points="${x},${fy} ${x+w},${fy} ${cx},${ay}" fill="${F1}" ${st}/><polygon points="${x+w},${fy} ${x+w+dx},${y} ${cx},${ay}" fill="${F2}" ${st}/><polygon points="${x},${fy} ${x+dx},${y} ${cx},${ay}" fill="${F3}" ${st}/>`+D(cx,ay,cx,fy-dy/2+ (dy/2))+T(cx+8,ay+t*.6,lt,'start');
 return[a[0],a[1]+t,a[2],G(0,t,a[3]+ap)]}
function cyl(r,h,lr,lt,o={}){const ry=r*.35,cx=r+30,c0=ry+12;let s=`<path d="M${cx-r},${c0} V${c0+h} A${r},${ry} 0 0 0 ${cx+r},${c0+h} V${c0} Z" fill="${F1}" ${st}/>`;
 if(o.w){const wy=c0+h*(1-o.w);s+=`<path d="M${cx-r},${wy} V${c0+h} A${r},${ry} 0 0 0 ${cx+r},${c0+h} V${wy} A${r},${ry} 0 0 1 ${cx-r},${wy}Z" fill="${WT}" opacity=".8"/>`}
 s+=`<ellipse cx="${cx}" cy="${c0}" rx="${r}" ry="${ry}" fill="${o.open?'#fff':F3}" ${st}/>`;
 if(o.ball){s+=`<circle cx="${cx}" cy="${c0+h/2}" r="${r}" fill="${F2}" opacity=".85" ${st}/>`+T(cx,c0+h/2+4,'bola')}
 s+=D(cx,c0,cx+r,c0)+T(cx+r/2,c0-ry-3,lr)+D(cx+r+14,c0,cx+r+14,c0+h)+T(cx+r+20,c0+h/2+4,lt,'start');
 return[cx+r+70,c0+h+ry+14,cx+r+70,s]}
function cone(r,h,lr,lt){const ry=r*.35,cx=r+30,by=12+h;let s=`<path d="M${cx-r},${by} A${r},${ry} 0 0 1 ${cx+r},${by}" ${dsh}/><path d="M${cx-r},${by} A${r},${ry} 0 0 0 ${cx+r},${by} L${cx},12 Z" fill="${F1}" ${st}/>`+D(cx,12,cx,by)+D(cx,by,cx+r,by)+T(cx+4,12+h/2,lt,'start')+T(cx+r/2,by+ry+16,lr);
 return[2*r+70,by+ry+26,2*r+70,s]}
function sph(r,lr,half){const cx=r+25,cy=r+14;let s=half?`<path d="M${cx-r},${cy} A${r},${r} 0 0 1 ${cx+r},${cy}Z" fill="${F1}" ${st}/><ellipse cx="${cx}" cy="${cy}" rx="${r}" ry="${r*.3}" fill="${F3}" ${st}/>`+D(cx,cy,cx+r,cy)+T(cx+r/2,cy+r*.3+16,lr):`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${F1}" ${st}/><path d="M${cx-r},${cy} A${r},${r*.3} 0 0 1 ${cx+r},${cy}" ${dsh}/><path d="M${cx-r},${cy} A${r},${r*.3} 0 0 0 ${cx+r},${cy}" fill="none" ${st}/>`+D(cx,cy,cx+r,cy)+`<circle cx="${cx}" cy="${cy}" r="2.5" fill="#022050"/>`+T(cx+r/2,cy-6,lr);
 return[2*r+50,half?cy+r*.3+28:2*r+30,2*r+50,s]}
function pyr(w,h,lw,lt,lts){const x=30,by=h+30,dx=w*.5,dy=-w*.3,ax=x+w/2+dx/2;let s=P(`${x},${by} ${x+dx},${by+dy} ${ax},12`,F3)+P(`${x},${by} ${x+w},${by} ${ax},12`,F1)+P(`${x+w},${by} ${x+w+dx},${by+dy} ${ax},12`,F2)+D(ax,12,ax,by+dy/2)+T(ax-6,12+h/2,lt,'end')+T(x+w/2,by+17,lw);
 if(lts)s+=`<line x1="${ax}" y1="12" x2="${x+w/2}" y2="${by}" stroke="#d6336c" stroke-width="2.2"/>`+T(x+w/4+ax/2-34,12+h*.6,lts,'end');
 return[x+w+dx+40,by+30,x+w+dx+40,s]}
function prism(){const A=[30,120],B=[130,120],C=[80,66],d=[60,-30];const q=p=>p.join(',');const S=(p,k)=>[p[0]+d[0],p[1]+d[1]];
 let s=P(`${q(A)} ${q(S(A))} ${q(S(C))} ${q(C)}`,F3)+P(`${q(B)} ${q(S(B))} ${q(S(C))} ${q(C)}`,F2)+P(`${q(A)} ${q(B)} ${q(C)}`,F1)+T(80,138,'alas (segitiga)')+T(168,100,'t');
 return[250,160,250,s]}
function cubepyr(){return boxP(80,80,80,'6 cm','6 cm','6 cm',60,'4 cm')}
function silo(r,h,lr,lt){const cx=r+30,c0=r+14,ry=r*.3;let s=`<path d="M${cx-r},${c0} V${c0+h} A${r},${ry} 0 0 0 ${cx+r},${c0+h} V${c0} Z" fill="${F1}" ${st}/><path d="M${cx-r},${c0} A${r},${r} 0 0 1 ${cx+r},${c0}Z" fill="${F2}" ${st}/>`+D(cx,c0,cx+r,c0)+T(cx+r/2,c0+14,lr)+D(cx+r+14,c0,cx+r+14,c0+h)+T(cx+r+20,c0+h/2,lt,'start');
 return[cx+r+70,c0+h+ry+14,cx+r+70,s]}
function tent(){const r=44,cx=74,ry=15,ct=105,cb=150;let s=`<path d="M${cx-r},${ct} V${cb} A${r},${ry} 0 0 0 ${cx+r},${cb} V${ct} Z" fill="${F1}" ${st}/><path d="M${cx-r},${ct} A${r},${ry} 0 0 0 ${cx+r},${ct} L${cx},12 Z" fill="${F2}" ${st}/>`+D(cx,12,cx,ct)+T(cx+5,62,'12 m','start')+D(cx,ct,cx+r,ct)+T(cx+r/2,ct+ry+14,'3,5 m')+T(cx-r-4,128,'2 m','end')+T(cx+r-20,52,'s = 12,5 m','start');
 return[260,190,260,s]}
function net(){const a=34;let s='';[[1,0],[0,1],[1,1],[2,1],[3,1],[1,2]].forEach(([i,j])=>s+=`<rect x="${10+i*a}" y="${10+j*a}" width="${a}" height="${a}" fill="${(i+j)%2?F1:F3}" ${st}/>`);return[150,120,150,s]}
function cylnet(){let s=`<circle cx="75" cy="30" r="20" fill="${F3}" ${st}/><rect x="10" y="50" width="130" height="50" fill="${F1}" ${st}/><circle cx="75" cy="120" r="20" fill="${F3}" ${st}/>`+T(75,80,'2πr × t')+T(75,32,'alas')+T(75,124,'tutup');return[150,150,150,s]}
function conenet(){const R=60,cx=80,cy=12,an=200*Math.PI/180,a0=(Math.PI-an)/2+Math.PI/2*0;const x1=cx+R*Math.cos(a0),y1=cy+R*Math.sin(a0),x2=cx+R*Math.cos(a0+an),y2=cy+R*Math.sin(a0+an);
 return[170,170,170,`<path d="M${cx},${cy} L${x1},${y1} A${R},${R} 0 1 1 ${x2},${y2} Z" fill="${F1}" ${st}/>`+T(cx,cy+34,'selimut')+`<circle cx="125" cy="140" r="20" fill="${F3}" ${st}/>`+T(125,144,'alas')]}
function many(list,H,W){let x=0,b='';list.forEach(([s,cap,k])=>{k=k||1;b+=G(x,0,s[3],k)+T(x+(s[0]*k)/2-10,H-6,cap);x+=s[0]*k+10});return[W||x,H,W||x,b]}
function water(){const c=cyl(40,70,'r = 7 cm','15 cm'),b=box(70,40,50,'14 cm','11 cm','');return[330,150,330,G(0,10,c[3],1)+`<path d="M175 80 H215" stroke="#022050" stroke-width="3"/><polygon points="215,72 230,80 215,88" fill="#022050"/>`+G(230,50,b[3],.9)]}
function two(){const a=cyl(20,60,'r','t'),b=cyl(60,20,'3r','t/3');return[360,130,360,G(0,10,a[3])+G(110,50,b[3])]}
function ballset(){let s=`<circle cx="60" cy="60" r="50" fill="${F1}" ${st}/>`+T(60,64,'r = 6 cm')+`<text x="130" y="68" font-size="30">→</text>`;for(let i=0;i<8;i++)s+=`<circle cx="${180+(i%4)*34}" cy="${48+Math.floor(i/4)*34}" r="14" fill="${F2}" ${st}/>`;return[330,125,330,s+T(248,115,'8 bola kecil')]}
function boxes3(){const a=box(60,60,60,'10','10','10'),b=box(100,25,50,'20','10','5'),c=box(140,25,25,'40','5','5');return[600,150,600,G(0,0,a[3])+G(150,35,b[3])+G(360,40,c[3])]}
function chart(){const rs=[3,4,5,6,7,8,10],ls=[723,601,557,560,594,652,828];const X=r=>50+(r-2)*44,Y=l=>230-(l-500)*.62;let s=`<line x1="50" y1="230" x2="400" y2="230" stroke="#022050" stroke-width="2"/><line x1="50" y1="30" x2="50" y2="230" stroke="#022050" stroke-width="2"/>`;
 [500,600,700,800].forEach(l=>s+=gl(50,Y(l),400,Y(l))+T(44,Y(l)+4,l,'end'));
 s+=`<polyline fill="none" stroke="#00a9ab" stroke-width="3" points="${rs.map((r,i)=>X(r)+','+Y(ls[i])).join(' ')}"/>`;
 rs.forEach((r,i)=>s+=`<circle cx="${X(r)}" cy="${Y(ls[i])}" r="5" fill="#ffd300" ${st}/>`+T(X(r),248,r)+T(X(r),Y(ls[i])-10,ls[i]));
 return[430,270,430,s+T(225,266,'r (cm)')+T(14,22,'L (cm²)','start')]}
function cylTrio(){const a=cyl(25,40,'r','t'),b=cyl(50,40,'2r','t'),c=cyl(50,80,'2r','2t');return[560,170,560,G(0,40,a[3])+G(150,40,b[3])+G(300,0,c[3])]}
function klas(){const L=[[box(60,50,50,'','','')[3],'(1) balok'],[cyl(30,50,'','')[3],'(2) tabung'],[cone(30,60,'','')[3],'(3) kerucut'],[pyr(60,60,'','')[3],'(4) limas'],[sph(32,'')[3],'(5) bola']];let s='';L.forEach(([b,c],i)=>s+=G(i*165,0,b,1)+T(i*165+70,200,c));return[840,210,840,s]}

<h3>A.2 Satuan volume dan liter</h3>
${fig('liter','Gambar 2.2. Satu kubus bersisi 10 cm berisi tepat 1 liter')}
<div class="wrap"><table><tr><th>Yang harus dihafal</th><th>Keterangan</th></tr><tr><td>$1\text{ cm}^3=1\text{ mL}$</td><td>kubus kecil $1\times1\times1$ cm</td></tr><tr><td>$1\text{ liter}=1\text{ dm}^3=1.000\text{ cm}^3$</td><td>$1\text{ dm}=10\text{ cm}$, sehingga $10\times10\times10=1.000$</td></tr><tr><td>$1\text{ m}^3=1.000\text{ liter}$</td><td>$1\text{ m}=10\text{ dm}$, sehingga $10\times10\times10=1.000\text{ dm}^3$</td></tr></table></div>

['b','B. Rumus Bangun Ruang',r`
<h3>B.1 Kubus dan balok</h3>
<p>Volume balok adalah banyaknya kubus satuan yang tersusun: <b>panjang × lebar × tinggi</b>. Luas permukaannya adalah luas jaring-jaring: enam sisi yang berpasangan sama besar.</p>
${fig('jar','Gambar 2.3. Jaring-jaring kubus dan balok: luas permukaan = jumlah luas semua sisi')}
<ul><li><b>Kubus</b> (rusuk $s$): $V=s^3$, $L=6s^2$.</li><li><b>Balok</b> ($p,l,t$): $V=p\times l\times t$, $L=2(pl+pt+lt)$.</li></ul>
<h3>B.2 Prisma</h3>
<p>Prisma punya alas dan tutup sama bentuk, disatukan sisi-sisi tegak berbentuk persegi panjang. Prisma seperti <b>tumpukan</b> alas setinggi $t$, sehingga volumenya selalu <b>luas alas × tinggi</b>.</p>
${fig('prisma','Gambar 2.4. Prisma segitiga: volume = luas alas × tinggi prisma')}
<ul><li>$V=L_{alas}\times t$ dan $L=2\times L_{alas}+(K_{alas}\times t)$ ($K$ = keliling).</li></ul>
<h3>B.3 Tabung</h3>
<p>Tabung adalah prisma beralas lingkaran. Jaring-jaringnya: dua lingkaran (alas dan tutup) dan satu persegi panjang (selimut) yang <b>panjangnya sama dengan keliling alas</b> $2\pi r$ dan lebarnya tinggi $t$.</p>
${fig('tabung','Gambar 2.5. Tabung dan jaring-jaringnya')}
<ul><li>$V=\pi r^2t$.</li><li>Luas selimut $=2\pi rt$. Luas permukaan $L=2\pi r^2+2\pi rt=2\pi r(r+t)$.</li></ul>
<h3>B.4 Limas</h3>
${fig('limas','Gambar 2.6. Limas: tinggi limas (t, garis putus-putus) berbeda dengan tinggi sisi tegak (tₛ, garis merah)')}
<ul><li>$V=\frac{1}{3}\times L_{alas}\times t$. (Tiga limas yang sama membentuk satu prisma beralas dan setinggi sama.)</li><li>$L=L_{alas}+$ jumlah luas sisi tegak. Tiap sisi tegak berbentuk segitiga, luasnya $\frac{1}{2}\times\text{alas}\times t_s$.</li></ul>
${box_('warn',r`<b>⚠ Dua "tinggi" pada limas.</b> <b>Tinggi limas</b> $t$ tegak lurus alas (menuju titik tengah alas). <b>Tinggi sisi tegak</b> $t_s$ berada pada bidang sisi tegak. Hubungannya (Pythagoras): $t_s^2=t^2+\left(\frac{a}{2}\right)^2$ untuk alas persegi bersisi $a$. Luas sisi tegak memakai $t_s$, volume memakai $t$.`)}
<h3>B.5 Kerucut</h3>
${fig('kerucut','Gambar 2.7. Kerucut dan jaring-jaringnya')}
<ul><li>Garis pelukis $s=\sqrt{r^2+t^2}$.</li><li>$V=\frac{1}{3}\pi r^2t$.</li><li>Luas selimut $=\pi rs$. Luas permukaan $L=\pi r^2+\pi rs=\pi r(r+s)$.</li></ul>
<h3>B.6 Bola</h3>
${fig('bola','Gambar 2.8. Bola dan setengah bola')}
<ul><li>Bola: $V=\frac{4}{3}\pi r^3$, $L=4\pi r^2$.</li><li>Setengah bola: $V=\frac{2}{3}\pi r^3$; luas lengkungnya $2\pi r^2$, dan bila bagian datar (tutup) dihitung, $L=3\pi r^2$.</li></ul>
<h3>B.7 Mengelompokkan: sisi datar atau lengkung?</h3>
${fig('klas','Gambar 2.9. Bangun ruang bersisi datar (balok, limas) dan bersisi lengkung (tabung, kerucut, bola)')}
<div class="box star"><b>★ Ringkasan rumus</b><div class="formula">
<div><b>Kubus</b><br>$V=s^3$, $L=6s^2$</div><div><b>Balok</b><br>$V=plt$, $L=2(pl+pt+lt)$</div><div><b>Prisma</b><br>$V=L_{alas}\times t$</div>
<div><b>Tabung</b><br>$V=\pi r^2t$, $L=2\pi r(r+t)$</div><div><b>Limas</b><br>$V=\frac{1}{3}L_{alas}t$</div><div><b>Kerucut</b><br>$V=\frac{1}{3}\pi r^2t$, $L=\pi r(r+s)$, $s=\sqrt{r^2+t^2}$</div><div><b>Bola</b><br>$V=\frac{4}{3}\pi r^3$, $L=4\pi r^2$</div></div></div>`],

  if(q.t==='multi'){const cs=[...document.querySelectorAll(`#q${q.n} input`)];let ok=true;cs.forEach((c,i)=>{const w=!!q.k[i];if(c.checked!==w)ok=false;c.disabled=true;c.closest('label').classList.add(w?'right':(c.checked?'wrong':''))});fin(q,ok,ok?'':'Kunci: A, B, D.')}
  else{const v=document.getElementById('in'+q.n).value.trim().replace(/\./g,'').replace(',','.');if(!v)return;const ok=Math.abs(parseFloat(v)-parseFloat(q.k))<.005;document.getElementById('in'+q.n).disabled=true;fin(q,ok,ok?'':`Jawaban yang tepat: ${q.u}.`)}}
});
drawQs();
window.addEventListener('load',()=>render());
</script>
