["Segitiga sama kaki: alas 10 cm, kaki 13 cm. Hitung luasnya.","Tripel 5-12-13 → tinggi 12. Luas = ½×10×12 = 60 cm².",["Diketahui alas = 10, kaki = 13. Ditanya luas.","Tinggi membagi alas jadi 5 cm. Pythagoras: t = √(13² − 5²) = √(169 − 25) = √144 = 12 cm.","Luas = {1|2} × alas × t = {1|2} × 10 × 12 = <b>60 cm²</b>."]],

{t:'pg',lv:1,p:'Mengidentifikasi',q:'Sebuah segi empat memiliki empat sisi sama panjang dan kedua diagonalnya berpotongan tegak lurus, tetapi sudut-sudutnya bukan sudut siku-siku. Bangun tersebut adalah ...',o:['belah ketupat','persegi panjang','jajargenjang','trapesium sama kaki'],a:0,c:'4 sisi sama + diagonal tegak lurus + sudut bukan 90° = belah ketupat.',l:['Catat ciri: 4 sisi sama, diagonal tegak lurus, sudut bukan 90°.','Persegi punya sudut 90° → coret. Layang-layang tidak punya 4 sisi sama → coret.','Jajargenjang & trapesium sisinya tidak semua sama → coret.','Jawaban: <b>belah ketupat (A)</b>.']},

{t:'tf',lv:1,p:'Memahami informasi',q:'(Benar/Salah) Tentang jaring-jaring bangun ruang:',o:['Selimut tabung pada jaring-jaringnya berbentuk persegi panjang.','Selimut kerucut pada jaring-jaringnya berbentuk lingkaran penuh.','Sisi tegak prisma segitiga tegak berbentuk persegi panjang.'],a:[1,0,1],c:'Selimut tabung = persegi panjang (B); selimut kerucut = juring (S); sisi tegak prisma = persegi panjang (B).',l:['Tabung: selimut dibuka jadi persegi panjang → <b>Benar</b>.','Kerucut: selimut dibuka jadi juring (potongan lingkaran), bukan lingkaran penuh → <b>Salah</b>.','Prisma tegak: sisi tegaknya persegi panjang → <b>Benar</b>.'],fig:'jar'},

{t:'pg',lv:2,p:'Memodelkan',q:'Kaleng tabung berdiameter 14 cm, tinggi 10 cm. Label menutupi seluruh selimut tanpa tumpang tindih. Luas label adalah ... (π = 22/7)',o:['154 cm²','220 cm²','308 cm²','440 cm²'],a:3,c:'Selimut = πdt = 22/7 × 14 × 10 = 440.',l:['Label = selimut tabung (tanpa alas/tutup).','Selimut = 2πrt = πdt, d = 14.','= {22|7} × 14 × 10 = 22 × 2 × 10 = <b>440 cm²</b>.']},

{t:'pg',lv:2,p:'Menginterpretasikan',q:'Pizza berdiameter 28 cm dipotong 8 bagian sama besar dari pusat. Luas satu potong adalah ... (π = 22/7)',o:['44 cm²','77 cm²','154 cm²','616 cm²'],a:1,c:'r = 14 → luas 616 → ÷ 8 = 77.',l:['d = 28 → r = 14 cm.','Luas pizza = {22|7} × 14 × 14 = 616 cm².','Satu potong = 616 ÷ 8 = <b>77 cm²</b>.']},
{t:'pg',lv:3,p:'Menganalisis',q:'Kubus ABCD.EFGH rusuk 6 cm. Jarak titik A ke bidang BDHF adalah ...',o:['3 cm','3√2 cm','6 cm','6√2 cm'],a:1,c:'Jaraknya setengah diagonal alas: ½ × 6√2 = 3√2.',l:['AC ⟂ BD (diagonal persegi) dan AC ⟂ BF → AC ⟂ bidang BDHF.','AC dan BD berpotongan di titik tengah.','Jarak = ½ AC = ½ × 6√2 = <b>3√2 cm</b>.'],fig:'pl'},
{t:'pg',lv:3,p:'Memecahkan masalah',q:'Tabung tepat di dalam kubus rusuk 14 cm (diameter dan tinggi tabung = rusuk kubus). Volume ruang kosong antara kubus dan tabung adalah ... (π = 22/7)',o:['588 cm³','2.156 cm³','2.744 cm³','4.900 cm³'],a:0,c:'Kubus 2.744 − tabung 2.156 = 588.',l:['V kubus = 14³ = 2.744 cm³.','Diameter 14 → r = 7. V tabung = {22|7} × 7² × 14 = 2.156 cm³.','Kosong = 2.744 − 2.156 = <b>588 cm³</b>.']},

<section id=c><h2 class=t>C. Materi Inti</h2><h3 id=materi>C.0 Prasyarat yang wajib diingat</h3>${T(['Hal','Isi'],[['Nilai π','22/7 jika r kelipatan 7; 3,14 jika r kelipatan 10 atau lainnya'],['Pythagoras','c² = a² + b² (c = sisi miring)'],['Tripel','3-4-5, 5-12-13, 8-15-17, 7-24-25 dan kelipatannya'],['Satuan','1 m = 100 cm; 1 m² = 10.000 cm²; 1 liter = 1.000 cm³'],['Akar','√2 ≈ 1,41; √3 ≈ 1,73; √8 = 2√2; √12 = 2√3; √18 = 3√2']])}
<h3>C.1 Bangun Datar</h3><b>1) Segitiga</b><ul><li>Jumlah sudut = <b>180°</b>. Keliling = a + b + c.</li><li>Luas = {1|2} × alas × tinggi (tinggi selalu tegak lurus alas).</li><li>Sama kaki: tinggi membagi alas jadi dua sama panjang → cari tinggi dengan Pythagoras.</li><li>Siku-siku: luas = {1|2} × sisi tegak 1 × sisi tegak 2.</li></ul>
<b>2) Segi empat</b><figure>${FIG.seg}<figcaption>Segi empat khusus; garis putus-putus merah = diagonal</figcaption></figure>${T(['Bangun','Sifat penting','Keliling','Luas'],[['Persegi','4 sisi sama, 4 siku-siku, diagonal sama &amp; tegak lurus','4s','s × s'],['Persegi panjang','Sisi berhadapan sama, 4 siku-siku, diagonal sama','2(p + l)','p × l'],['Jajargenjang','Sisi berhadapan sejajar &amp; sama, diagonal saling membagi dua','2(a + b)','alas × tinggi'],['Belah ketupat','4 sisi sama, diagonal tegak lurus &amp; saling membagi dua','4s','{1|2} × d₁ × d₂'],['Layang-layang','2 pasang sisi bersebelahan sama, diagonal tegak lurus','2(a + b)','{1|2} × d₁ × d₂'],['Trapesium','1 pasang sisi sejajar (sama kaki: kaki sama)','jumlah 4 sisi','{1|2} × (a + b) × t']])}
<div class=box><b>Ingat:</b> tinggi jajargenjang/trapesium <b>bukan</b> sisi miring, tetapi jarak tegak lurus dua sisi sejajar. Persegi = kasus khusus persegi panjang dan belah ketupat.</div>
<b>3) Lingkaran</b><figure>${FIG.cir}<figcaption>Pusat O, jari-jari r, juring (kuning), tali busur (hijau)</figcaption></figure>${T(['Besaran','Rumus'],[['Diameter','d = 2r'],['Keliling','K = 2πr = πd'],['Luas','L = πr²'],['Panjang busur','{θ|360°} × keliling'],['Luas juring','{θ|360°} × luas lingkaran'],['Luas tembereng','luas juring − luas segitiga (pusat &amp; ujung tali busur)'],['Sudut pusat','= 2 × sudut keliling yang menghadap busur sama']])}
<b>4) Bangun datar gabungan</b><p><b>Cara cepat:</b> pecah menjadi bangun dasar lalu <b>jumlahkan</b>, atau bangun besar <b>dikurangi</b> bangun kecil (daerah arsir). Keliling: hitung garis <b>sisi luar</b> saja.</p>
<h3>C.2 Bangun Ruang</h3>${T(['Bangun','Sisi','Rusuk','Titik sudut'],[['Kubus','6','12','8'],['Balok','6','12','8'],['Prisma segitiga','5','9','6'],['Limas segi empat','5','8','5'],['Tabung','3','2 (lengkung)','0'],['Kerucut','2','1 (lengkung)','1'],['Bola','1','0','0']])}
<h3>Rumus volume dan luas permukaan</h3>${T(['Bangun','Volume','Luas permukaan'],[['Kubus','s³','6s² (jumlah rusuk = 12s)'],['Balok','p × l × t','2(pl + pt + lt) (jumlah rusuk = 4(p+l+t))'],['Prisma','luas alas × t','2 × luas alas + keliling alas × t'],['Limas','{1|3} × luas alas × t','luas alas + jumlah luas sisi tegak'],['Tabung','πr²t','2πr(r + t); selimut = 2πrt'],['Kerucut','{1|3}πr²t','πr(r + s); selimut = πrs; s = √(r² + t²)'],['Bola','{4|3}πr³','4πr²']])}
<h3>Diagonal pada kubus dan balok</h3><figure>${FIG.cu1}<figcaption>Merah: diagonal sisi AC. Oranye: diagonal ruang AG</figcaption></figure>${T(['Unsur','Kubus (rusuk s)','Balok (p, l, t)'],[['Diagonal sisi','s√2','√(p² + l²), dst'],['Diagonal ruang','s√3','√(p² + l² + t²)'],['Bidang diagonal','persegi panjang s × s√2; luas s²√2','persegi panjang, satu sisinya diagonal alas'],['Banyaknya','12 diagonal sisi, 4 diagonal ruang, 6 bidang diagonal','sama']])}
<h3>C.3 Hubungan Bangun Datar dengan Bangun Ruang</h3><figure>${FIG.jar}${FIG.ker}<figcaption>Jaring-jaring tabung dan kerucut</figcaption></figure>${T(['Bangun ruang','Dari bangun datar','Hubungan ukuran'],[['Kubus','6 persegi kongruen','sisi persegi = rusuk'],['Balok','3 pasang persegi panjang','ukuran p, l, t'],['Prisma tegak','2 alas + sisi tegak persegi panjang','tinggi prisma = lebar persegi panjang'],['Limas','1 alas + sisi tegak segitiga','tinggi segitiga sisi tegak ≠ tinggi limas'],['Tabung','2 lingkaran + 1 persegi panjang','panjang selimut = keliling alas = 2πr'],['Kerucut','1 lingkaran + 1 juring','jari-jari juring = s; busur juring = keliling alas'],['Bola','tidak punya jaring-jaring datar','L = 4 × luas lingkaran besar']])}
<h3>C.4 Jarak pada Bangun Ruang</h3><ul><li><b>Dua titik</b>: panjang ruas garis penghubung.</li><li><b>Titik ke garis / bidang</b>: panjang garis dari titik yang <b>tegak lurus</b> garis/bidang itu.</li><li><b>Dua garis/bidang sejajar</b>: jarak satu titik di yang pertama ke yang kedua (kubus: jarak sisi berhadapan = rusuk).</li><li><b>Strategi:</b> cari <b>segitiga siku-siku</b> yang memuat jarak itu, lalu pakai Pythagoras.</li></ul></section>
<section id=d><h2 class=t>D. Contoh Soal Terbimbing</h2>${EX.map((e,i)=>`<details><summary>Contoh ${i+1}: ${e[0]}</summary>${SOL(e[1],e[2])}</details>`).join('')}
<div class="box bad"><b>Jebakan umum:</b> tinggi vs sisi miring • diameter vs jari-jari • lupa ⅓ pada limas/kerucut • tinggi limas ≠ tinggi sisi tegak • s√2 tertukar s√3 • selimut ≠ luas permukaan • satuan (cm² ke m², liter) • keliling gabungan ikut menghitung garis sambungan.</div></section>
<section id=latihan><h2 class=t>E. Latihan &amp; Prediksi Soal TKA (15 soal)</h2><p>Kerjakan dulu, lalu jawab. Setelah dijawab, muncul kunci dengan <b>cara cepat</b> dan <b>cara lengkap</b>. <span class=sk id=sk>Skor: 0/15</span></p><div id=qs></div><button class=b onclick="location.reload()">↻ Ulangi latihan</button><p><small>Soal prediksi disusun dari kisi-kisi dan pola TKA, bukan soal resmi.</small></p></section>`;
document.getElementById('app').innerHTML=mat;
const done=new Set();
function fin(i,ok){const q=Q[i];done.add(i);if(ok)sk++;document.getElementById('sk').textContent='Skor: '+sk+'/15';const e=document.getElementById('x'+i);e.innerHTML=`<b style="color:var(${ok?'--ok':'--no'})">${ok?'✔ Benar!':'✘ Belum tepat'}</b>`+SOL(q.c,q.l);}
document.getElementById('qs').innerHTML=Q.map((q,i)=>{let h=`<div class=q><span class=lv>Level ${q.lv} | ${q.p}</span> <b>Soal ${i+1}</b><p>${M(q.q)}</p>${q.fig?`<figure>${FIG[q.fig]}</figure>`:''}`;
if(q.t=='pg')h+=q.o.map((o,j)=>`<button class=o onclick="pg(${i},${j})">${LB[j]}. ${M(o)}</button>`).join('');
if(q.t=='mc')h+=q.o.map((o,j)=>`<label class=o style="display:block"><input type=checkbox name=m${i} value=${j}> ${LB[j]}. ${M(o)}</label>`).join('')+`<button class=b onclick="mc(${i})">Periksa jawaban</button>`;
if(q.t=='tf')h+=q.o.map((o,j)=>`<div class=o style="cursor:default">${j+1}. ${M(o)}<br><label><input type=radio name=t${i}_${j} value=1> Benar</label> &nbsp; <label><input type=radio name=t${i}_${j} value=0> Salah</label></div>`).join('')+`<button class=b onclick="tf(${i})">Periksa jawaban</button>`;
return h+`<div class=ex id=x${i}></div></div>`}).join('');
function pg(i,j){if(done.has(i))return;const q=Q[i],b=document.querySelectorAll('#qs .q')[i].querySelectorAll('.o');b.forEach((x,k)=>{x.disabled=true;if(k==q.a)x.classList.add('ok');else if(k==j)x.classList.add('no')});fin(i,j==q.a)}
function mc(i){if(done.has(i))return;const q=Q[i],v=[...document.querySelectorAll(`input[name=m${i}]:checked`)].map(x=>+x.value);fin(i,v.join()==q.a.join())}
function tf(i){if(done.has(i))return;const q=Q[i];let ok=true;q.a.forEach((a,j)=>{const r=document.querySelector(`input[name=t${i}_${j}]:checked`);if(!r||+r.value!=a)ok=false});fin(i,ok)}
</script></body></html>
